<style>
:root{--fg:#14161B;--muted:#6B7280;--bg:#F6F5F2;--panel:#FFF;--line:#E6E4DF;--bad:#C8322B;--acc:#14161B;--accfg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#ECEDEF;--muted:#9CA3AF;--bg:#121316;--panel:#1B1D21;--line:#2C2F35;--bad:#F87171;--acc:#ECEDEF;--accfg:#121316}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.eb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:8px 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.rec{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:14px 0 0}
button{width:100%;margin-top:18px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:12px}
</style></head><body><main>
<form id="f" autocomplete="on">

  <label class="rec"><input id="r" type="checkbox" checked> Recordarme en este dispositivo</label>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e" role="alert"></div>
</form></main>

const te = new TextEncoder();
