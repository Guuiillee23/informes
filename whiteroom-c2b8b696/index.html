<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="mk-protegido" content="1"><title>White Room · Acceso</title>
<style>
:root{--fg:#14161B;--muted:#6B7280;--bg:#F6F5F2;--panel:#FFF;--line:#E6E4DF;--bad:#C8322B;--acc:#14161B;--accfg:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#ECEDEF;--muted:#9CA3AF;--bg:#121316;--panel:#1B1D21;--line:#2C2F35;--bad:#F87171;--acc:#ECEDEF;--accfg:#121316}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.eb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:8px 0 20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.rec{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:14px 0 0}
button{width:100%;margin-top:18px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:12px}
</style></head><body><main>
<form id="f" autocomplete="on">
  <div class="eb">Maktiva</div><h1>White Room</h1>
  <label for="u">Usuario</label><input id="u" type="text" autocomplete="username" required autofocus>
  <label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
  <label class="rec"><input id="r" type="checkbox" checked> Recordarme en este dispositivo</label>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e" role="alert"></div>
</form></main>

const te = new TextEncoder();
async function claves(maestra) {
  const k = await crypto.subtle.importKey('raw', maestra, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const h = async (t) => new Uint8Array(await crypto.subtle.sign('HMAC', k, te.encode(t)));
  return { enc: await h('enc'), mac: await h('mac') };
}
async function abrir(maestra) {
  const { enc, mac } = await claves(maestra);
  const iv = b64(PAQ.iv), ct = b64(PAQ.ct), ivct = new Uint8Array(iv.length + ct.length); ivct.set(iv); ivct.set(ct, iv.length);
  const km = await crypto.subtle.importKey('raw', mac, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!(await crypto.subtle.verify('HMAC', km, b64(PAQ.tag), ivct))) return false;
  const ke = await crypto.subtle.importKey('raw', enc, { name: 'AES-CTR' }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 64 }, ke, ct));
  // El dashboard se abre a pantalla completa dentro de un iframe (no se usa document.write: Chrome puede bloquear scripts así)
  const fr = document.createElement('iframe');
  fr.setAttribute('title', 'White Room');
  fr.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent';
  fr.srcdoc = html;
  document.body.replaceChildren(fr);
  const i1 = html.indexOf('<title>'), i2 = html.indexOf('</title>'); if (i1 > -1 && i2 > i1) document.title = html.slice(i1 + 7, i2);
  return true;
}
async function derivar(u, p) {
  const base = await crypto.subtle.importKey('raw', te.encode(u.trim().toLowerCase() + ':' + p), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(PAQ.s), iterations: PAQ.it, hash: 'SHA-256' }, base, 256));
}
if (/[?&]salir/.test(location.search)) { try { localStorage.removeItem(CLAVE_LS); } catch (e) {} }   // ...?salir = cerrar sesión en este dispositivo
(async () => {   // sesión recordada
  if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r));
  try { const g = JSON.parse(localStorage.getItem(CLAVE_LS) || 'null'); if (g && g.s === PAQ.s && await abrir(b64(g.m))) return; } catch (e) {}
})();
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Comprobando…'; e.textContent = '';
  try {
    const m = await derivar(document.getElementById('u').value, document.getElementById('p').value);
    const recordar = document.getElementById('r').checked;
    if (recordar) { try { localStorage.setItem(CLAVE_LS, JSON.stringify({ s: PAQ.s, m: btoa(String.fromCharCode(...m)) })); } catch (x) {} }
    if (await abrir(m)) return;
    try { localStorage.removeItem(CLAVE_LS); } catch (x) {}
    e.textContent = 'Usuario o contraseña incorrectos.';
  } catch (x) { e.textContent = 'Este navegador no puede abrir la página (' + x.message + ').'; }
  b.disabled = false; b.textContent = 'Entrar';
});
